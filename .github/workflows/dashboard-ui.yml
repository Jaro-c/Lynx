name: dashboard-ui

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  # Always runs so the four required UI jobs below always report. On a change
  # that does not touch the UI, every step in those jobs is skipped via `if:`,
  # so the job still concludes SUCCESS (a required check reported as SUCCESS is
  # satisfied — unlike a whole job skipped via a job-level `if:`, which GitHub
  # leaves unsatisfied and blocks the PR). This replaces the old `on.paths`
  # filter that left the four checks perpetually pending on non-UI PRs.
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        name: Check whether UI files changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif printf '%s' "$BEFORE_SHA" | grep -qE '^0+$'; then
            echo "New branch (no base commit) — running UI jobs."
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="${BEFORE_SHA}...${AFTER_SHA}"
          fi
          echo "Comparing range: ${range}"
          if git diff --name-only "$range" | grep -qE '^lynx/dashboard/ui/'; then
            echo "UI files changed — running UI jobs."
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "No UI files changed — UI job steps skip; jobs still report success."
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  audit:
    name: Security audit (bun)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lynx/dashboard/ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.changes.outputs.ui == 'true'

      - name: Install bun
        if: needs.changes.outputs.ui == 'true'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: needs.changes.outputs.ui == 'true'
        run: bun install --frozen-lockfile

      - name: audit
        if: needs.changes.outputs.ui == 'true'
        run: bun audit --audit-level high

  typecheck:
    name: TypeScript
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lynx/dashboard/ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.changes.outputs.ui == 'true'

      - name: Install bun
        if: needs.changes.outputs.ui == 'true'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: needs.changes.outputs.ui == 'true'
        run: bun install --frozen-lockfile

      - name: typecheck
        if: needs.changes.outputs.ui == 'true'
        run: bun run typecheck

  test:
    name: Unit tests (Vitest)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lynx/dashboard/ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.changes.outputs.ui == 'true'

      - name: Install bun
        if: needs.changes.outputs.ui == 'true'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: needs.changes.outputs.ui == 'true'
        run: bun install --frozen-lockfile

      - name: test
        if: needs.changes.outputs.ui == 'true'
        run: bun run test

  e2e:
    name: E2E tests (Playwright)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lynx/dashboard/ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.changes.outputs.ui == 'true'

      - name: Install bun
        if: needs.changes.outputs.ui == 'true'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: needs.changes.outputs.ui == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: needs.changes.outputs.ui == 'true'
        run: bunx playwright install chromium --with-deps

      - name: Build
        if: needs.changes.outputs.ui == 'true'
        run: bun run build
        env:
          BACKEND_URL: http://localhost:8080

      - name: Run E2E tests
        if: needs.changes.outputs.ui == 'true'
        run: bun run test:e2e
        env:
          CI: "true"
          BACKEND_URL: http://localhost:8080

      - name: Upload Playwright report
        if: ${{ needs.changes.outputs.ui == 'true' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: lynx/dashboard/ui/playwright-report/
          retention-days: 7
