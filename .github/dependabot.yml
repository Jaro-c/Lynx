version: 2

# Labels come from the org taxonomy in ai-context standards/workflow:
# `type:` for what the change is, `area:` for where it lands. Dependabot
# creates any label it names that does not exist yet, so a config naming
# something outside the taxonomy does not just mis-label a pull request -
# it manufactures the label and keeps it alive. This repository was the
# only one still doing that (`dependencies`, `ci`, `rust`, `dashboard`),
# which is why cleaning up the labels had to start here.
#
# The ecosystem distinction the old labels carried is kept, expressed in
# `area:` where it belongs, rather than in a parallel vocabulary.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "type:ci"
    open-pull-requests-limit: 10
    target-branch: "develop"

  - package-ecosystem: "cargo"
    directory: "/internal"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "area:core"
    open-pull-requests-limit: 10
    target-branch: "develop"

  - package-ecosystem: "bun"
    directory: "/internal/dashboard/ui"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "area:dashboard"
    open-pull-requests-limit: 10
    target-branch: "develop"
    groups:
      types:
        patterns: ["@types/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
